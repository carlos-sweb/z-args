name: Tests and Zig documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Zig 0.17.0
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src tests
      - name: Run tests in all optimization modes
        shell: bash
        run: |
          for mode in Debug ReleaseSafe ReleaseFast ReleaseSmall; do
            zig build test -Doptimize="$mode" --summary all
          done
      - name: Generate native Zig docs
        run: zig build docs --summary all
      - name: Upload documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: zig-out/docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy native Zig docs
        id: deployment
        uses: actions/deploy-pages@v4
